# BARU (16 Nov 2026): isi-mundur broksum harian 2 Jan - 29 Jun 2026 dari sumber data (stock.arjum.com).
# Kode: repo privat catatan-saham-mtf tools/backfill/broksum_backfill.py (diambil saat jalan memakai PRIVAT_TOKEN).
# Hasil ditulis ke cabang privat `broksum-backfill` repo privat (BUKAN apk-data/apk-next/api-data, BUKAN repo ini).
# Log repo ini publik: skrip hanya mencetak jumlah dan tanggal, tidak pernah data broker.
name: Isi mundur broksum
# Dijalankan tepat setelah kuota harian sumber data reset (00.00 WIB). Memakai SELURUH jatah 1.000 panggilan per hari (atas perintah pemilik 16 Nov 2026;
# kuota dipakai bersama chat, jadi chat tidak punya jatah sampai reset berikutnya). Satu hari bursa (semua saham) per run, mundur dari 29 Jun (30 Jun sudah diunggah pemilik).
on:
  schedule:
    - cron: "10 17 * * *"   # 00.10 WIB (setiap hari; kuota reset harian)
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = 1 panggilan uji lalu berhenti; isi = jalan normal"
        type: choice
        options: [isi, selftest]
        default: isi
      maks:
        description: "Batas panggilan API run ini"
        default: "1000"
      cadangan:
        description: "Berhenti bila sisa kuota di header <= angka ini (0 = pakai seluruh jatah)"
        default: "0"
permissions:
  contents: read
concurrency:
  group: backfill-broksum
  cancel-in-progress: false
jobs:
  isi:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IDX_EDGE_KEY: ${{ secrets.IDX_EDGE_KEY }}
      REPO_PRIVAT: https://x-access-token:${{ secrets.PRIVAT_TOKEN }}@github.com/CatatanSaham/catatan-saham-mtf.git
    steps:
      - uses: actions/checkout@v4
        with: {path: main, repository: CatatanSaham/catatan-saham-mtf, token: "${{ secrets.PRIVAT_TOKEN }}", ref: main, sparse-checkout: tools/backfill}
      - uses: actions/checkout@v4
        with:
          repository: CatatanSaham/catatan-saham-mtf
          token: ${{ secrets.PRIVAT_TOKEN }}
          ref: apk-next
          path: next
          sparse-checkout: apk/www/shards
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Ambil cabang broksum-backfill (buat baru bila belum ada)
        run: |
          if git ls-remote --exit-code "$REPO_PRIVAT" broksum-backfill >/dev/null; then
            git clone -q --depth 1 --branch broksum-backfill "$REPO_PRIVAT" out
          else
            mkdir out && cd out && git init -q -b broksum-backfill && git remote add origin "$REPO_PRIVAT"
          fi
      - name: Uji awal (1 panggilan, bandingkan dengan acuan BBCA)
        if: github.event.inputs.mode == 'selftest' || hashFiles('out/status.json') == ''
        run: python main/tools/backfill/broksum_backfill.py --shards next/apk/www/shards --out out --selftest
      - name: Isi mundur
        if: github.event.inputs.mode != 'selftest'
        run: python main/tools/backfill/broksum_backfill.py --shards next/apk/www/shards --out out --mulai 2026-06-29 --sampai 2026-01-02 --maks "${{ github.event.inputs.maks || '1000' }}" --cadangan "${{ github.event.inputs.cadangan || '0' }}"
      - name: Simpan ke broksum-backfill (hanya bila berubah)
        if: always() && github.event.inputs.mode != 'selftest'
        run: |
          cd out
          [ -f README.md ] || cp ../main/tools/backfill/README.md README.md
          git config user.name "Isi Mundur Broksum"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --quiet && { echo "Tidak ada perubahan."; exit 0; }
          git commit -q -m "broksum-backfill $(python -c "import json;d=json.load(open('status.json'));print(d['hari_selesai'],'/',d['hari_bursa_total'],'hari')")"
          git push -q origin HEAD:broksum-backfill
