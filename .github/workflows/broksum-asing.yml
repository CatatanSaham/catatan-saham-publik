# BARU (16 Nov 2026): broksum ASING per broker (flow=F) dari IDX Edge.
# Kode: repo privat catatan-saham-mtf tools/backfill/broksum_backfill.py (diambil memakai PRIVAT_TOKEN).
# Daftar saham per tanggal dari ZIP harian pemilik (cabang privat apk-data). Hasil ke cabang privat `broksum-asing`.
# Log repo ini publik: skrip hanya mencetak jumlah dan tanggal, tidak pernah data broker.
# 17 Nov 2026: jalan otomatis tiap hari bursa. Daftar saham dari hasil robot broksum harian (cabang broksum-harian)
# digabung ZIP pemilik, jadi tetap jalan walau pemilik berhenti unggah. Hanya hari yang belum ada (10 hari terakhir).
name: Broksum asing per broker (IDX Edge)
on:
  schedule:
    - cron: "30 13 * * 1-5"   # 20.30 WIB Sen-Jum (robot broksum harian biasanya selesai ±18.10)
    - cron: "0 0 * * 2-6"     # 07.00 WIB Sel-Sab: susulan bila malamnya data harian belum ada
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = 1 panggilan uji; isi = jalan normal"
        type: choice
        options: [isi, selftest]
        default: isi
      mulai:
        description: "Tanggal terbaru (YYYY-MM-DD)"
        default: "2026-11-16"
      sampai:
        description: "Tanggal terlama (YYYY-MM-DD)"
        default: "2026-07-01"
      maks:
        description: "Batas panggilan API run ini"
        default: "4400"
      cadangan:
        description: "Berhenti bila sisa kuota <= angka ini"
        default: "300"
permissions:
  contents: read
concurrency:
  group: broksum-asing
  cancel-in-progress: false
jobs:
  isi:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      IDX_EDGE_KEY: ${{ secrets.IDX_EDGE_KEY }}
      REPO_PRIVAT: https://x-access-token:${{ secrets.PRIVAT_TOKEN }}@github.com/CatatanSaham/catatan-saham-mtf.git
    steps:
      - uses: actions/checkout@v4
        with: {path: main, repository: CatatanSaham/catatan-saham-mtf, token: "${{ secrets.PRIVAT_TOKEN }}", ref: main, sparse-checkout: tools/backfill}
      - uses: actions/checkout@v4
        with:
          repository: CatatanSaham/catatan-saham-mtf
          token: ${{ secrets.PRIVAT_TOKEN }}
          ref: apk-data
          path: data
          sparse-checkout: apk-data/harian
      - uses: actions/checkout@v4
        with:
          repository: CatatanSaham/catatan-saham-mtf
          token: ${{ secrets.PRIVAT_TOKEN }}
          ref: broksum-harian
          path: robot
          sparse-checkout: harian
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Ambil cabang broksum-asing (buat baru bila belum ada)
        run: |
          if git ls-remote --exit-code "$REPO_PRIVAT" broksum-asing >/dev/null; then
            git clone -q --depth 1 --branch broksum-asing "$REPO_PRIVAT" out
          else
            mkdir out && cd out && git init -q -b broksum-asing && git remote add origin "$REPO_PRIVAT"
          fi
      - name: Uji awal (1 panggilan, acuan BBCA 16 Nov)
        if: github.event_name == 'workflow_dispatch'
        run: python main/tools/backfill/broksum_backfill.py --flow F --out out --harian data/apk-data/harian --selftest
      - name: Ambil asing per broker (jadwal harian)
        if: github.event_name == 'schedule'
        run: python main/tools/backfill/broksum_backfill.py --flow F --folder bfa --harian data/apk-data/harian --robot robot/harian --out out --hari-mundur 10 --maks 2000 --cadangan 1500
      - name: Ambil asing per broker
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'selftest'
        run: python main/tools/backfill/broksum_backfill.py --flow F --folder bfa --harian data/apk-data/harian --robot robot/harian --out out --mulai "${{ github.event.inputs.mulai }}" --sampai "${{ github.event.inputs.sampai }}" --maks "${{ github.event.inputs.maks }}" --cadangan "${{ github.event.inputs.cadangan }}"
      - name: Simpan ke broksum-asing (hanya bila berubah)
        if: always() && (github.event_name == 'schedule' || github.event.inputs.mode != 'selftest')
        run: |
          cd out
          git config user.name "Broksum Asing"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --quiet && { echo "Tidak ada perubahan."; exit 0; }
          git commit -q -m "broksum-asing $(python -c "import json;d=json.load(open('status.json'));print(d['hari_selesai'],'/',d['hari_bursa_total'],'hari')")"
          git push -q origin HEAD:broksum-asing
