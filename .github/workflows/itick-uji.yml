# Uji sekali iTick (cabang itick-uji saja). Log publik: hanya jumlah bar, jam, dan harga BBCA (data pasar umum). Kunci tidak dicetak.
name: Uji iTick (sementara)
on:
  push:
    branches: [itick-uji]
permissions:
  contents: read
jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ITICK_KEY: ${{ secrets.ITICK_KEY }}
    steps:
      - shell: python
        run: |
          import os, json, time, urllib.request, urllib.parse, datetime as dt
          k = os.environ.get("ITICK_KEY", "").strip()
          print("kunci ada:", bool(k), "panjang:", len(k))
          WIB = dt.timezone(dt.timedelta(hours=7))
          jam = lambda ms: dt.datetime.fromtimestamp(ms / 1000, WIB).strftime("%Y-%m-%d %H:%M")
          def get(nama, **q):
              url = "https://api-free.itick.org/stock/kline?" + urllib.parse.urlencode(q)
              req = urllib.request.Request(url, headers={"accept": "application/json", "token": k})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      j = json.loads(r.read().decode())
                      h = {x: r.headers.get(x) for x in r.headers.keys() if "limit" in x.lower() or "remain" in x.lower()}
              except urllib.error.HTTPError as e:
                  print(f"[{nama}] HTTP {e.code}: {e.read(300).decode('utf-8','replace')}"); return
              d = j.get("data") or []
              print(f"[{nama}] code={j.get('code')} msg={j.get('msg')} bar={len(d)} header={h}")
              if d:
                  d = sorted(d, key=lambda x: x["t"])
                  print("   pertama:", jam(d[0]["t"]), d[0]); print("   terakhir:", jam(d[-1]["t"]), d[-1])
                  hari = sorted({jam(x["t"])[:10] for x in d}); print("   jumlah hari:", len(hari), hari[:3], "..", hari[-3:])
              time.sleep(13)  # paket gratis ±5 panggilan/menit
          lalu = int((dt.datetime.now(WIB) - dt.timedelta(days=30)).timestamp() * 1000)
          get("1m terbaru", region="ID", code="BBCA", kType=1, limit=1000)
          get("1m 30 hari lalu", region="ID", code="BBCA", kType=1, limit=500, et=lalu)
          get("15m terbaru", region="ID", code="BBCA", kType=3, limit=1000)
          get("harian", region="ID", code="BBCA", kType=8, limit=5)
