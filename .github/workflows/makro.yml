# DIPINDAH dari repo privat CatatanSaham/catatan-saham-mtf (makro.yml) karena menit Actions repo privat terbatas.
# Kode & data tetap di repo privat; diambil saat jalan memakai secret PRIVAT_TOKEN. Jangan cetak data mentah ke log (log repo ini publik).
name: Makro (PDB, inflasi, BI-Rate)
on:
  schedule:
    - cron: "37 10 * * 1,4"   # Senin & Kamis 17.37 WIB
  workflow_dispatch:
    inputs:
      tes:
        description: Kirim pesan uji ke Telegram
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: makro
  cancel-in-progress: false
jobs:
  makro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CatatanSaham/catatan-saham-mtf
          token: ${{ secrets.PRIVAT_TOKEN }}
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          repository: CatatanSaham/catatan-saham-mtf
          token: ${{ secrets.PRIVAT_TOKEN }}
          ref: apk-data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baca angka makro
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          MAKRO_TEST: ${{ inputs.tes && '1' || '' }}
        run: python main/makro/makro.py data/apk-data/makro.json
      - name: Simpan ke cabang apk-data
        run: |
          cd data
          git config user.name "Robot Makro"
          git config user.email "noreply@github.com"
          git add apk-data/makro.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Makro $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin apk-data && git push -q origin HEAD:apk-data && break; sleep 5; done
