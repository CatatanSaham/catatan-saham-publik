name: Penjaga (picu robot saat ada unggahan / kode baru)
# Repo privat tidak bisa memicu robot di repo ini secara langsung, jadi penjaga ini memeriksa repo privat:
# tiap 5 menit, saat APK admin selesai mengirim data (repository_dispatch "unggah"), atau manual.
# Data harian baru → Clean Buy Telegram, data bot, foreign, hitung modul, data API, terbit publik.
# File kepemilikan baru → terbit publik. apk-next berubah → OTA Non Admin. apk-build berubah → rakit APK admin.
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [unggah, kode]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: pemicu
  cancel-in-progress: false
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .robot
      - name: Bandingkan repo privat dan picu robot
        env:
          GH_TOKEN: ${{ github.token }}
          PT: ${{ secrets.PRIVAT_TOKEN }}
        run: python3 .robot/pemicu.py
      - name: Rapikan daftar (hapus run Penjaga lama yang sukses)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hanya run Penjaga yang SUKSES dan sudah selesai; run gagal dan run robot lain dibiarkan. Yang terbaru (3) disisakan.
          WF=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .workflow_id)
          gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?status=success&per_page=100" --jq '.workflow_runs|sort_by(.created_at)|reverse|.[3:]|.[].id' \
            | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null 2>&1 || true; done
