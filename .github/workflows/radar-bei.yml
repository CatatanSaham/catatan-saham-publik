# DIPINDAH dari repo privat CatatanSaham/catatan-saham-mtf (radar-bei.yml) karena menit Actions repo privat terbatas.
# Kode & data tetap di repo privat; diambil saat jalan memakai secret PRIVAT_TOKEN. Jangan cetak data mentah ke log (log repo ini publik).
name: Radar BEI sore
on:
  schedule:
    - cron: "37 9 * * 1-5"   # 16.37 WIB, Senin–Jumat
    - cron: "15 10 * * 1-5"  # 17.15 WIB: kirim hasil Radar AI (tugas Claude 16.10 WIB) ke Telegram
  workflow_dispatch:
    inputs:
      tes:
        description: Kirim pesan uji ke Telegram
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: radar-bei
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CatatanSaham/catatan-saham-mtf
          token: ${{ secrets.PRIVAT_TOKEN }}
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          repository: CatatanSaham/catatan-saham-mtf
          token: ${{ secrets.PRIVAT_TOKEN }}
          ref: apk-data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Saring berita
        if: github.event.schedule != '15 10 * * 1-5'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          RADAR_TEST: ${{ inputs.tes && '1' || '' }}
        run: python main/radar/radar.py main/universe.json data/apk-data/radar.json
      - name: Kirim Radar AI ke Telegram
        if: github.event.schedule == '15 10 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python main/radar/radar.py --kirim-ai data/apk-data/radar.json
      - name: Simpan ke cabang apk-data
        run: |
          cd data
          git config user.name "Radar BEI"
          git config user.email "noreply@github.com"
          git add apk-data/radar.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Radar BEI $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin apk-data && git push -q origin HEAD:apk-data && break; sleep 5; done
