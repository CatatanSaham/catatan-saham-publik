# BARU (22 Nov 2026): bahan "Transaksi besar & siapa sangkut" per saham dari running trade (done-detail).
# Kode: repo privat catatan-saham-mtf tools/donedetail/ringkas_bs.py. Membaca cabang privat done-detail (dd/), menulis rk/bs/KODE.json.gz.
# Tanpa panggilan API (tidak memakai kuota IDX Edge). Hari yang sudah ada dilewati, jadi aman diulang.
# Jalan otomatis setelah "Running trade + done detail" selesai, atau manual. Log publik: hanya jumlah.
name: Ringkas transaksi besar
on:
  workflow_run:
    workflows: ["Running trade + done detail"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ulang:
        description: "ulang = hitung ulang semua hari"
        type: choice
        options: ["tidak", "ulang"]
        default: "tidak"
permissions:
  contents: read
concurrency:
  group: done-detail
  cancel-in-progress: false
jobs:
  ringkas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPO_DD: https://x-access-token:${{ secrets.PRIVAT_TOKEN }}@github.com/CatatanSaham/catatan-saham-dd.git
    steps:
      - uses: actions/checkout@v4
        with: {path: main, repository: CatatanSaham/catatan-saham-mtf, token: "${{ secrets.PRIVAT_TOKEN }}", ref: main, sparse-checkout: tools/donedetail}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Ambil cabang done-detail
        run: git clone -q --depth 1 --branch main "$REPO_DD" out
      - name: Ringkas transaksi besar per saham
        run: python main/tools/donedetail/ringkas_bs.py --out out ${{ github.event.inputs.ulang == 'ulang' && '--ulang' || '' }}
      - name: Simpan ke done-detail (hanya bila berubah)
        if: always()
        run: |
          cd out
          git config user.name "Running Trade"
          git config user.email "noreply@github.com"
          git add -A rk/bs
          git diff --cached --quiet && { echo "Tidak ada perubahan."; exit 0; }
          git commit -q -m "rk/bs transaksi besar $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && break; [ "$i" = 5 ] && exit 1; sleep $((i*3)); git pull -q --rebase origin main || true; done
