# BARU (22 Nov 2026): tambal hari kosong candlestick 15 menit (dan 1 menit bila iTick sudah punya) dari hasil robot iTick.
# Robot harian IDX Edge ("Robot 1 & 15 menit") hanya bisa mengambil SESI TERAKHIR, jadi hari yang terlewat tidak bisa diambil mundur dari sana.
# Kode: repo privat catatan-saham-mtf tools/m15/tambal_itick.py. Tanpa panggilan API (hanya membaca cabang privat itick-mundur),
# jadi tidak memakai kuota IDX Edge. Hanya menulis tanggal yang BELUM ada di cabang privat m15-harian; berkas yang ada tidak ditimpa.
# Log publik: hanya jumlah dan tanggal.
name: Tambal 1 & 15 menit
on:
  workflow_run:
    workflows: ["Isi mundur chart (iTick)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m15-harian
  cancel-in-progress: false
jobs:
  tambal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO_PRIVAT: https://x-access-token:${{ secrets.PRIVAT_TOKEN }}@github.com/CatatanSaham/catatan-saham-mtf.git
    steps:
      - uses: actions/checkout@v4
        with: {path: main, repository: CatatanSaham/catatan-saham-mtf, token: "${{ secrets.PRIVAT_TOKEN }}", ref: main, sparse-checkout: tools/m15}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Ambil cabang itick-mundur
        run: git clone -q --depth 1 --branch itick-mundur "$REPO_PRIVAT" itick
      - name: Ambil cabang m15-harian (buat baru bila belum ada)
        run: |
          if git ls-remote --exit-code "$REPO_PRIVAT" refs/heads/m15-harian >/dev/null; then
            git clone -q --depth 1 --branch m15-harian "$REPO_PRIVAT" out
          else
            mkdir out && cd out && git init -q -b m15-harian && git remote add origin "$REPO_PRIVAT"
          fi
      - name: Tambal hari kosong dari iTick
        run: python main/tools/m15/tambal_itick.py --itick itick --out out
      - name: Simpan ke m15-harian (hanya bila berubah)
        if: always()
        run: |
          cd out
          git config user.name "Robot M15"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --quiet && { echo "Tidak ada perubahan."; exit 0; }
          git commit -q -m "m15-harian tambal iTick $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git push -q origin HEAD:m15-harian && break; [ "$i" = 5 ] && exit 1; sleep $((i*3)); git pull -q --rebase origin m15-harian || true; done
