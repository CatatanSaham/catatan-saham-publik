# Uji /foreign bot Telegram terhadap data asing APK (dipindah dari repo privat radar-catatan-saham-bot, 19 Nov 2026,
# karena menit Actions repo privat terbatas). Kode bot dan data diambil saat jalan memakai PRIVAT_TOKEN.
# Log repo ini publik: JANGAN cetak angka data. Yang dicetak hanya LULUS / GAGAL beserta kode saham.
name: Uji /foreign bot Telegram
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Cabang repo bot"
        default: "main"
  workflow_run:
    workflows: ["Publish verified Foreign lots for private Telegram bot"]
    types: [completed]
  schedule:
    - cron: "17 1 * * 1-5"   # 08.17 WIB hari bursa: cek kode bot terbaru
permissions:
  contents: read
concurrency:
  group: uji-foreign-bot
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CatatanSaham/radar-catatan-saham-bot
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVAT_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CatatanSaham/catatan-saham-mtf
          ref: apk-data
          path: apk-source
          token: ${{ secrets.PRIVAT_TOKEN }}
          persist-credentials: false
          sparse-checkout: bot-data/foreign.json
          sparse-checkout-cone-mode: false
      - name: Cek sintaks
        run: node --check index.js
      - name: Jalankan /foreign sell 5 terhadap data APK
        run: |
          cat > /tmp/uji.cjs <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const source=fs.readFileSync('index.js','utf8');
          const foreign=JSON.parse(fs.readFileSync('apk-source/bot-data/foreign.json','utf8'));
          const gagal=m=>{console.error('GAGAL: '+m);process.exit(1)};
          try{assert.equal(foreign.source,'apk-rs');assert.equal(foreign.verified,true)}catch(e){gagal('data foreign.json bukan apk-rs terverifikasi')}
          const ctx=vm.createContext({Intl,Number,String,Object,Array,Set,JSON,Math,console:{log(){},error(){}}});
          const m=source.match(/async function foreignCommand\(args, env\) \{[\s\S]*?\n\}\n\nasync function brokerCommand/);if(!m)gagal('fungsi foreignCommand tidak ditemukan di index.js');
          const fn=vm.runInContext(m[0].replace(/\nasync function brokerCommand$/,'')+';foreignCommand',ctx);
          ctx.dataFile=async()=>foreign;ctx.tickerArg=a=>/^[A-Z]{4}$/.test(a[0])?a[0]:'';
          ctx.fmt=v=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(v);ctx.esc=x=>String(x);ctx.dateId=x=>x;
          const ses=Object.keys(foreign.sessions).sort().slice(-5),f=foreign.unit==='shares'?100:1;
          const har=t=>{let b=0,s=0;for(const d of ses){const p=foreign.sessions[d][t];if(!Array.isArray(p))gagal(t+' tidak ada di sesi '+d);b+=p[0];s+=p[1]}return{b:b/f,s:s/f,net:(b-s)/f}};
          (async()=>{
            for(const t of ['BBCA','BMRI','BBRI']){const e=har(t),r=await fn(['sell','5',t],{});
              const ok=r.includes(t)&&r.includes(ses[0])&&r.includes(ses.at(-1))&&r.includes('B '+ctx.fmt(e.b)+' lot')&&r.includes('S '+ctx.fmt(e.s)+' lot')&&r.includes('Net '+(e.net>0?'+':'')+ctx.fmt(e.net)+' lot');
              if(!ok)gagal('/foreign sell 5 '+t+' tidak cocok dengan data APK');process.stdout.write('LULUS '+t+'\n')}
            const rk=await fn(['sell','5'],{});
            const lengkap=Object.keys(foreign.sessions[ses.at(-1)]).filter(t=>ses.every(d=>Array.isArray(foreign.sessions[d][t])));
            const top=lengkap.map(t=>[t,har(t).s]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0][0];
            if(!(rk.includes('Foreign Sell')&&rk.includes('1. <b>'+top+'</b>')))gagal('ranking /foreign sell 5 salah urut');
            process.stdout.write('LULUS ranking /foreign sell 5\n');
          })().catch(()=>gagal('galat saat menjalankan foreignCommand'));
          JS
          node /tmp/uji.cjs
